<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <text x="40" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Missing Values Treatment Audit: Before vs After Pipeline</text>
  <text x="40" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Automated statistical imputation eliminated 100% of missing attributes across all features</text>

  <!-- Legend -->
  <rect x="620" y="38" width="16" height="16" rx="4" fill="url(#barRed)"/>
  <text x="645" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Raw Missing (%)</text>
  <rect x="760" y="38" width="16" height="16" rx="4" fill="url(#barGreen)"/>
  <text x="785" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Post-Cleaning (%)</text>

  <!-- Chart Area -->
  <g transform="translate(180, 120)">
    <!-- Grid Lines -->
    <line x1="0" y1="0" x2="650" y2="0" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="60" x2="650" y2="60" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="120" x2="650" y2="120" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="180" x2="650" y2="180" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="240" x2="650" y2="240" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="300" x2="650" y2="300" stroke="#475569" stroke-width="2"/>

    <!-- Y Labels (Features) -->
    <text x="-15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="end">Customer_Name</text>
    <text x="-15" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="end">Email Address</text>
    <text x="-15" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="end">Country</text>
    <text x="-15" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="end">Order_Date</text>
    <text x="-15" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="end">Unit_Price</text>

    <!-- Bars: Feature 1 (Customer Name: 9.8% -> 0%) -->
    <rect x="0" y="10" width="245" height="18" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
    <text x="255" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">9.8% (98 rows)</text>
    <rect x="0" y="32" width="6" height="10" rx="2" fill="url(#barGreen)"/>
    <text x="15" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.0% (0 rows)</text>

    <!-- Bars: Feature 2 (Email: 12.0% -> 0%) -->
    <rect x="0" y="70" width="300" height="18" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
    <text x="310" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">12.0% (120 rows)</text>
    <rect x="0" y="92" width="6" height="10" rx="2" fill="url(#barGreen)"/>
    <text x="15" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.0% (0 rows)</text>

    <!-- Bars: Feature 3 (Country: 8.5% -> 0%) -->
    <rect x="0" y="130" width="212" height="18" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
    <text x="222" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">8.5% (85 rows)</text>
    <rect x="0" y="152" width="6" height="10" rx="2" fill="url(#barGreen)"/>
    <text x="15" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.0% (0 rows)</text>

    <!-- Bars: Feature 4 (Order Date: 6.2% -> 0%) -->
    <rect x="0" y="190" width="155" height="18" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
    <text x="165" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">6.2% (62 rows)</text>
    <rect x="0" y="212" width="6" height="10" rx="2" fill="url(#barGreen)"/>
    <text x="15" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.0% (0 rows)</text>

    <!-- Bars: Feature 5 (Unit Price: 7.4% -> 0%) -->
    <rect x="0" y="250" width="185" height="18" rx="4" fill="url(#barRed)" filter="url(#shadow)"/>
    <text x="195" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">7.4% (74 rows)</text>
    <rect x="0" y="272" width="6" height="10" rx="2" fill="url(#barGreen)"/>
    <text x="15" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">0.0% (0 rows)</text>
  </g>
</svg>