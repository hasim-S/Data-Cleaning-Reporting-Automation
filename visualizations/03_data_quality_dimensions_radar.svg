<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#qBg)"/>

  <text x="40" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Data Quality Dimensions Benchmark</text>
  <text x="40" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Evaluation across the 5 core industry Data Governance & Quality Dimensions</text>

  <!-- Legend -->
  <rect x="620" y="42" width="16" height="16" rx="4" fill="url(#barBefore)"/>
  <text x="645" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Pre-Cleaning Score</text>
  <rect x="780" y="42" width="16" height="16" rx="4" fill="url(#barAfter)"/>
  <text x="805" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Post-Cleaning</text>

  <!-- Chart -->
  <g transform="translate(60, 110)">
    <!-- Y-axis guide lines -->
    <line x1="60" y1="280" x2="800" y2="280" stroke="#334155" stroke-width="1.5"/>
    <line x1="60" y1="210" x2="800" y2="210" stroke="#1e293b" stroke-dasharray="4,4"/>
    <line x1="60" y1="140" x2="800" y2="140" stroke="#1e293b" stroke-dasharray="4,4"/>
    <line x1="60" y1="70" x2="800" y2="70" stroke="#1e293b" stroke-dasharray="4,4"/>
    <line x1="60" y1="0" x2="800" y2="0" stroke="#1e293b" stroke-dasharray="4,4"/>

    <!-- Y labels -->
    <text x="45" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0%</text>
    <text x="45" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">25%</text>
    <text x="45" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">50%</text>
    <text x="45" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">75%</text>
    <text x="45" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">100%</text>

    <!-- Dimension 1: Completeness (88.4% -> 100%) -->
    <g transform="translate(100, 0)">
      <rect x="0" y="32.5" width="40" height="247.5" rx="6" fill="url(#barBefore)"/>
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">88.4%</text>
      <rect x="48" y="0" width="40" height="280" rx="6" fill="url(#barAfter)"/>
      <text x="68" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">100%</text>
      <text x="44" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Completeness</text>
    </g>

    <!-- Dimension 2: Uniqueness (95.0% -> 100%) -->
    <g transform="translate(245, 0)">
      <rect x="0" y="14" width="40" height="266" rx="6" fill="url(#barBefore)"/>
      <text x="20" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">95.0%</text>
      <rect x="48" y="0" width="40" height="280" rx="6" fill="url(#barAfter)"/>
      <text x="68" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">100%</text>
      <text x="44" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Uniqueness</text>
    </g>

    <!-- Dimension 3: Validity (78.2% -> 99.8%) -->
    <g transform="translate(390, 0)">
      <rect x="0" y="61" width="40" height="219" rx="6" fill="url(#barBefore)"/>
      <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">78.2%</text>
      <rect x="48" y="0.5" width="40" height="279.5" rx="6" fill="url(#barAfter)"/>
      <text x="68" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">99.8%</text>
      <text x="44" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Validity</text>
    </g>

    <!-- Dimension 4: Consistency (64.5% -> 100%) -->
    <g transform="translate(535, 0)">
      <rect x="0" y="99.4" width="40" height="180.6" rx="6" fill="url(#barBefore)"/>
      <text x="20" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">64.5%</text>
      <rect x="48" y="0" width="40" height="280" rx="6" fill="url(#barAfter)"/>
      <text x="68" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">100%</text>
      <text x="44" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Consistency</text>
    </g>

    <!-- Dimension 5: Accuracy (81.2% -> 99.6%) -->
    <g transform="translate(680, 0)">
      <rect x="0" y="52.6" width="40" height="227.4" rx="6" fill="url(#barBefore)"/>
      <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">81.2%</text>
      <rect x="48" y="1.1" width="40" height="278.9" rx="6" fill="url(#barAfter)"/>
      <text x="68" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">99.6%</text>
      <text x="44" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Accuracy</text>
    </g>
  </g>
</svg>